# SPDX-License-Identifier: GPL-3.0-or-later
name: Build & Release All OS Binaries

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: pulsedns-windows-amd64.exe
            binary_path: build/bin/pulsedns.exe
          - os: macos-latest
            platform: darwin/universal
            artifact: pulsedns-macos-universal.zip
            binary_path: build/bin/PulseDNS.app
          - os: ubuntu-24.04
            platform: linux/amd64
            tags: -tags webkit2_41
            artifact: pulsedns-linux-amd64
            binary_path: build/bin/pulsedns

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Linux WebKitGTK dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails v2 CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Run unit tests & vet
        run: |
          go vet ./...
          go test -v ./internal/...

      - name: Build Wails binary (${{ matrix.platform }})
        run: |
          wails build -platform ${{ matrix.platform }} ${{ matrix.tags }} -clean -trimpath -ldflags "-s -w"

      - name: Package macOS Universal .app bundle
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          ditto -c -k --sequesterRsrc --keepParent PulseDNS.app ../../${{ matrix.artifact }}

      - name: Prepare Windows / Linux binary artifact
        if: runner.os != 'macOS'
        run: |
          cp ${{ matrix.binary_path }} ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          chmod +x pulsedns-linux-amd64 || true
          sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
